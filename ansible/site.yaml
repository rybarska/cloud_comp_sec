---
- name: Step 0 - Establish Site-to-Site VPN Tunnel via strongSwan
  hosts: oracle-vpn, aws-vpn
  gather_facts: no
  become: yes
  tasks:
    - name: Load all strongSwan configurations on both VPN gateways
      ansible.builtin.raw: swanctl --load-all
      changed_when: true

- name: Step 0.1 - Initiate VPN connection from AWS VPN side
  hosts: aws-vpn
  gather_facts: no
  become: yes
  tasks:
    - name: Initiate the cloud-network child association
      ansible.builtin.raw: swanctl --initiate --child cloud-network
      register: tunnel_result
      changed_when: true
      failed_when: false

- name: Configure AWS VPN Gateway Forwarding and Firewall
  hosts: aws-vpn
  become: yes
  tasks:
    - name: Step 1 - Make IP forwarding permanent via sysctl
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_file: /etc/sysctl.d/99-ip-forward.conf
        state: present
        reload: yes

    - name: Step 2 - Install iptables-persistent for saving firewall rules
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Step 3 - Allow forwarding from Web Service to Database (Port 3306)
      ansible.builtin.iptables:
        chain: FORWARD
        source: '10.20.1.195'
        destination: '10.0.2.37'
        protocol: tcp
        destination_port: '3306'
        jump: ACCEPT
        state: present

    - name: Step 4 - Allow established and related return traffic in FORWARD chain
      ansible.builtin.iptables:
        chain: FORWARD
        source: '10.0.0.0/16'
        destination: '10.20.0.0/20'
        ctstate: 'RELATED,ESTABLISHED'
        jump: ACCEPT
        state: present

    - name: Step 5 - Save iptables rules permanently to disk
      ansible.builtin.command: netfilter-persistent save
      changed_when: false
