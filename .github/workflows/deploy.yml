name: Deploy Multi-Cloud Infrastructure via Ansible

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible pymysql

      - name: Configure SSH Private Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > 
~/.ssh/oracle_key.pem
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/oracle_key.pem ~/.ssh/aws_key.pem
          echo -e "Host *\n\tStrictHostKeyChecking no" > ~/.ssh/config

      - name: Create Temporary Vault Password File
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > 
/tmp/vault_pass.txt

      - name: Run Ansible Playbook
        working-directory: ./ansible
        run: |
          ansible-playbook -i hosts.yaml site.yaml --vault-password-file 
/tmp/vault_pass.txt

      - name: Clean up Vault Password File
        if: always()
        run: |
          rm -f /tmp/vault_pass.txt
